<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veux-tu être ma Valentine ?</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts included in style.css -->
</head>

<body>

    <!-- Floating hearts background (managed by JS) -->

    <!-- Initial Question Page -->
    <div class="container" id="initial-view">
        <h1 class="main-title">Veux-tu être ma Valentine ? 💖</h1>
        <p class="subtitle">Dis oui s'il te plaît...</p>

        <div class="buttons">
            <button id="yes-btn" class="btn yes-btn">OUI ❤️</button>
            <button id="no-btn" class="btn no-btn">Non 💔</button>
        </div>
    </div>

    <!-- Success Page (Hidden Initially) -->
    <div class="container hidden" id="success-view">
        <h1 class="success-title">Yay ! Je t'aime ! 💑</h1>

        <div class="gallery">
            <img src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif" alt="Cute Gif">
            <img src="images/final_photo1.jpg" alt="Our Memory 1">
            <img src="images/final_photo2.jpg" alt="Our Memory 2">
            <div class="love-text">
                <p>Merci d'avoir dit oui ! ❤️</p>
                <p>Tu es la meilleure chose qui me soit arrivée.</p>
                <p>On se voit le 14 Février ! 🌹</p>
                <!-- Add your own message here! -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
