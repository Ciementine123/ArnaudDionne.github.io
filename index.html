<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veux-tu être ma Valentine ?</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background Slideshow - 14 photos hardcoded -->
    <div id="slideshow-bg">
        <img src="images/photo1.jpg" class="active" alt="">
        <img src="images/photo2.jpg" alt="">
        <img src="images/photo3.jpg" alt="">
        <img src="images/photo4.jpg" alt="">
        <img src="images/photo5.jpg" alt="">
        <img src="images/photo6.jpg" alt="">
        <img src="images/photo7.jpg" alt="">
        <img src="images/photo8.jpg" alt="">
        <img src="images/photo9.jpg" alt="">
        <img src="images/photo10.jpg" alt="">
        <img src="images/photo11.jpg" alt="">
        <img src="images/photo12.jpg" alt="">
        <img src="images/photo13.jpg" alt="">
        <img src="images/photo14.jpg" alt="">
    </div>

    <!-- Initial Question Page -->
    <div class="container" id="initial-view">
        <h1>Veux-tu être ma Valentine ? 💖</h1>
        <p class="subtitle">Dis oui s'il te plaît...</p>
        <div class="buttons">
            <button id="yes-btn" class="btn yes-btn">OUI ❤️</button>
            <button id="no-btn" class="btn no-btn">Non 💔</button>
        </div>
    </div>

    <!-- Success Page (Hidden Initially) -->
    <div class="container hidden" id="success-view">
        <h1>Yay ! Je t'aime ! 💑</h1>
        <div class="love-text">
            <p>Merci d'avoir dit oui ! ❤️</p>
            <p>Tu es la meilleure chose qui me soit arrivée.</p>
            <p>On se voit le 14 Février ! 🌹</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
