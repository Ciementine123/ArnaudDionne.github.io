<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veux-tu être ma Valentine ?</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts included in style.css -->
</head>

<body>

    <!-- Floating hearts background (managed by JS) -->

    <!-- Initial Question Page -->
    <div class="container" id="initial-view">
        <h1 class="main-title">Veux-tu être ma Valentine ? 💖</h1>
        <p class="subtitle">Dis oui s'il te plaît...</p>

        <div class="buttons">
            <button id="yes-btn" class="btn yes-btn">OUI ❤️</button>
            <button id="no-btn" class="btn no-btn">Non 💔</button>
        </div>
    </div>

    <!-- Success Page (Hidden Initially) -->
    <div class="container hidden" id="success-view">
        <h1 class="success-title">Yay ! Je t'aime ! 💑</h1>

        <div class="gallery">
            <img src="https://media.giphy.com/media/26BRv0ThflsHCqDrG/giphy.gif" alt="Cute Gif">
            <img src="images/150004b0-320d-46e6-ac19-1ccb50f07584.jpg" alt="Our Memory 1">
            <img src="images/25f35c44-f76c-4558-b057-d687ffa70369.jpg" alt="Our Memory 2">
            <img src="images/2dcb7d5b-6df7-4ae7-af36-47fa9a4e8418.jpg" alt="Our Memory 3">
            <img src="images/377eebfb-3b26-4d85-9f15-0c09b6d9b81d.jpg" alt="Our Memory 4">
            <img src="images/3b569c50-5189-4b09-bc7c-7a1e989e8a8b.jpg" alt="Our Memory 5">
            <img src="images/44c31ded-c95b-43ce-b97d-4e78848a2534.jpg" alt="Our Memory 6">
            <img src="images/674d53fa-30cb-4bd9-850d-dfa4e0912944.jpg" alt="Our Memory 7">
            <img src="images/7678c4a3-e4d7-4e3d-b6c7-49cd5739e659.jpg" alt="Our Memory 8">
            <img src="images/9b13d572-6dda-471a-8bd3-b7d4237badc2.jpg" alt="Our Memory 9">
            <img src="images/ce40f18e-dc8a-450e-ae47-465b458d8345.jpg" alt="Our Memory 10">
            <img src="images/e162ac04-83b7-4941-be9a-1b337f91755d.jpg" alt="Our Memory 11">
            <img src="images/e2fa9603-6221-4199-b977-5a4372c6a79a.jpg" alt="Our Memory 12">
            <img src="images/e53fd5be-da30-444c-af12-a8be28832dea.jpg" alt="Our Memory 13">
            <img src="images/ed5d6fd2-4934-4676-b427-57bb4ec2a832.jpg" alt="Our Memory 14">
            <div class="love-text">
                <p>Merci d'avoir dit oui ! ❤️</p>
                <p>Tu es la meilleure chose qui me soit arrivée.</p>
                <p>On se voit le 14 Février ! 🌹</p>
                <!-- Add your own message here! -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
